<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D - Plano Lucas</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; }
        .instructions { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #aaa; font-size: 13px; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; pointer-events: none; z-index: 5; }
        #loading-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; transition: opacity 0.5s ease; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #00ffcc; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text" style="margin-top: 20px; font-weight: bold; color: #00ffcc;">Procesando estructura 3D...</p>
    </div>

    <div class="instructions">Click izquierdo para rotar | Scroll para zoom | Click derecho para mover el plano</div>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;
        const container = document.getElementById('canvas-container');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            // Ajustamos la distancia de la cámara (far) a 100000 para que no corte planos grandes
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 100000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Iluminación intensa y desde múltiples ángulos para evitar sombras negras fijas
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight1.position.set(5000, 10000, 5000);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight2.position.set(-5000, 5000, -5000);
            scene.add(dirLight2);

            cargarModelo();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function cargarModelo() {
            const loader = new THREE.OBJLoader();
            
            // ATENCIÓN: Si le cambiaste el nombre al archivo .obj, ponelo acá abajo exactamente igual
            loader.load(
                'lucas rault.obj', 
                function (obj) {
                    
                    // Forzamos un material gris claro básico en todas las mallas para asegurar visibilidad
                    obj.traverse((child) => {
                        if (child.isMesh) {
                            child.material = new THREE.MeshLambertMaterial({ 
                                color: 0xcccccc, 
                                side: THREE.DoubleSide
                            });
                        }
                    });

                    // Calculamos la caja contenedora real del plano
                    const box = new THREE.Box3().setFromObject(obj);
                    const size = box.getSize(new THREE.Vector3());
                    const center = box.getCenter(new THREE.Vector3());
                    
                    // Centramos el plano de forma absoluta en el origen (0,0,0)
                    obj.position.x = -center.x;
                    obj.position.y = -center.y;
                    obj.position.z = -center.z;
                    scene.add(obj);

                    // Reubicamos la cámara dinámicamente según la escala real de Sweet Home 3D
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 * Math.tan(fov / 2)) * 2.5;
                    
                    if(cameraZ === 0 || isNaN(cameraZ)) cameraZ = 2000;

                    // Posicionamos la cámara desde arriba y en diagonal para ver el plano completo
                    camera.position.set(maxDim * 0.8, maxDim * 1.2, cameraZ);
                    camera.lookAt(0, 0, 0);
                    
                    controls.target.set(0, 0, 0);
                    controls.update();

                    // Quitamos el cartel de carga
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => loadingOverlay.style.display = 'none', 500);
                },
                function (xhr) {
                    if (xhr.total) {
                        const porcentaje = Math.round((xhr.loaded / xhr.total) * 100);
                        loadingText.innerText = `Cargando geometría: ${porcentaje}%`;
                    } else {
                        loadingText.innerText = "Procesando mapa 3D...";
                    }
                },
                function (error) {
                    loadingText.innerText = "Error en la estructura del objeto.";
                    console.error(error);
                }
            );
        }

        init3D();
    </script>
</body>
</html>
